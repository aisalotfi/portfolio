    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b89a78"/><stop offset=".45" stop-color="#667568"/><stop offset="1" stop-color="#283d34"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="260" fill="#9fae8d" opacity=".15"/>
  <circle cx="120" cy="900" r="310" fill="#c7a76d" opacity=".10"/>
