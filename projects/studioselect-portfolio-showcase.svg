    <g transform="translate(310)"><rect width="285" height="350" rx="18" fill="#8e795f"/><circle cx="250" cy="35" r="21" fill="#fff"/><path d="M241 35l6 6 13-15" fill="none" stroke="#48604f" stroke-width="5" stroke-linecap="round"/><path d="M40 265q95-150 205 0" fill="#dec9a8" opacity=".38"/><text x="22" y="320" fill="#fff" font-size="16" font-family="Arial">FRAME 02 · SELECTED</text></g>
